services:
  - type: worker
    name: allcheckerbot
    runtime: python
    buildCommand: |
      apt-get update && apt-get install -y unrar-free && pip install python-telegram-bot aiohttp curl_cffi requests aiofiles urllib3 rarfile
    startCommand: python allcheckerbot.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
